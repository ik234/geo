<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#102d38">
    <!-- Хостинг отдаёт только статику, настоящий 302 здесь выставить негде,
         поэтому переезд объявляем тремя способами сразу. -->
    <meta http-equiv="refresh" content="0; url=https://ik234.github.io/geo/">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://ik234.github.io/geo/">
    <title>Географический детектив переехал</title>
    <style>
      :root {
        font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #143440;
        background: #edf4f6;
        font-size: 18px;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 20px;
        color: #527680;
        line-height: 1.5;
      }
      a.go {
        display: inline-block;
        background: #102d38;
        color: #f7fbfb;
        text-decoration: none;
        padding: 14px 26px;
        border-radius: 14px;
        font-size: 18px;
      }
      .url {
        display: block;
        margin-top: 18px;
        font-size: 14px;
        color: #527680;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Игра переехала</h1>
      <p>«Географический детектив» теперь живёт на новом адресе. Сейчас откроется сам — или нажмите кнопку.</p>
      <a class="go" href="https://ik234.github.io/geo/">Открыть игру</a>
      <span class="url">https://ik234.github.io/geo/</span>
    </main>
    <script>
      location.replace('https://ik234.github.io/geo/');
    </script>
  </body>
</html>
