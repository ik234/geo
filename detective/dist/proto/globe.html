<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#102d38">
    <title>Прототип: страны на глобусе</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../style.css">
    <style>
      .proto-note {
        font-size: 14px;
        color: #b8d3d9;
      }

      .proto-controls {
        margin-bottom: 16px;
      }

      /* Карте нужна колонка пошире, чем флагу. */
      .globe-game {
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      }

      .globe-visual {
        min-height: 0;
        padding: 16px;
        gap: 10px;
      }

      #globe {
        display: block;
        width: 100%;
        height: 420px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 14px;
      }

      .legend span::before {
        content: '';
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 5px;
        border-radius: 3px;
        vertical-align: -1px;
        background: var(--swatch);
        border: 1px solid var(--edge);
      }

      .choices button.picked {
        background: #e3eef1;
        border-color: #143440;
        box-shadow: inset 0 0 0 1px #143440;
      }

      .choices button.wrong-pick {
        background: #fbe3d6;
        border-color: #ca501b;
      }

      .choices button.missed {
        border-style: dashed;
        border-color: #138064;
      }

      .choices button.wrong-pick:disabled,
      .choices button.missed:disabled {
        opacity: 1;
      }

      @media (max-width: 700px) {
        /* На телефоне шапка должна остаться в одну строку. */
        .proto-note {
          display: none;
        }

        .globe-game {
          grid-template-columns: minmax(0, 1fr);
        }

        .globe-visual {
          padding: 8px;
        }

        #globe {
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="../">ГЕО / ДЕТЕКТИВ</a>
      <span class="proto-note" id="note"></span>
      <label class="lang-pick">
        <span id="langLabel">Язык</span>
        <select id="lang">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="pl">Polski</option>
        </select>
      </label>
    </header>
    <main>
      <div class="controls proto-controls">
        <div class="modes" id="modes"></div>
        <div class="modes" id="levels"></div>
      </div>
      <section class="game globe-game">
        <div class="visual globe-visual">
          <canvas id="globe" role="img"></canvas>
          <small class="legend" id="legend"></small>
        </div>
        <div class="question">
          <span class="tag" id="tag"></span>
          <h2 id="title"></h2>
          <div class="choices" id="choices"></div>
          <p class="message" id="message" role="status"></p>
          <div class="actions">
            <button id="check" hidden></button>
            <button class="primary" id="next" disabled></button>
          </div>
        </div>
      </section>
    </main>
    <script src="../assets/d3.min.js"></script>
    <script src="../assets/topojson.min.js"></script>

      function detectLang() {
        const wanted = navigator.languages?.length ? navigator.languages : [navigator.language];
        for (const tag of wanted) {
          const base = String(tag || '').toLowerCase().split('-')[0];
          if (langs.includes(base)) return base;
        }
        return 'en';
      }

      function loadLang() {
        try {
          const saved = localStorage.getItem('geoDetectiveLang');
          if (saved && langs.includes(saved)) return saved;
        } catch {}
        return detectLang();
      }

      let lang = loadLang();

      function t(key, vars = {}) {
        return (text[lang][key] ?? text.en[key] ?? key).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? '');
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }

      // Пары кодов и ручные названия — из app.js: alpha-2 нужен Intl для
      // названий, alpha-3 — карте.
      const pairs = [['af', 'AFG'], ['ao', 'AGO'], ['al', 'ALB'], ['ae', 'ARE'], ['ar', 'ARG'], ['am', 'ARM'], ['aq', 'ATA'], ['tf', 'ATF'], ['au', 'AUS'], ['at', 'AUT'], ['az', 'AZE'], ['bi', 'BDI'], ['be', 'BEL'], ['bj', 'BEN'], ['bf', 'BFA'], ['bd', 'BGD'], ['bg', 'BGR'], ['bs', 'BHS'], ['ba', 'BIH'], ['by', 'BLR'], ['bz', 'BLZ'], ['bo', 'BOL'], ['br', 'BRA'], ['bn', 'BRN'], ['bt', 'BTN'], ['bw', 'BWA'], ['cf', 'CAF'], ['ca', 'CAN'], ['ch', 'CHE'], ['cl', 'CHL'], ['cn', 'CHN'], ['ci', 'CIV'], ['cm', 'CMR'], ['cd', 'COD'], ['cg', 'COG'], ['co', 'COL'], ['cr', 'CRI'], ['cu', 'CUB'], ['cy', 'CYP'], ['cz', 'CZE'], ['de', 'DEU'], ['dj', 'DJI'], ['dk', 'DNK'], ['do', 'DOM'], ['dz', 'DZA'], ['ec', 'ECU'], ['eg', 'EGY'], ['er', 'ERI'], ['es', 'ESP'], ['ee', 'EST'], ['et', 'ETH'], ['fi', 'FIN'], ['fj', 'FJI'], ['fk', 'FLK'], ['fr', 'FRA'], ['ga', 'GAB'], ['gb', 'GBR'], ['ge', 'GEO'], ['gh', 'GHA'], ['gn', 'GIN'], ['gm', 'GMB'], ['gw', 'GNB'], ['gq', 'GNQ'], ['gr', 'GRC'], ['gl', 'GRL'], ['gt', 'GTM'], ['gy', 'GUY'], ['hn', 'HND'], ['hr', 'HRV'], ['ht', 'HTI'], ['hu', 'HUN'], ['id', 'IDN'], ['in', 'IND'], ['ie', 'IRL'], ['ir', 'IRN'], ['iq', 'IRQ'], ['is', 'ISL'], ['il', 'ISR'], ['it', 'ITA'], ['jm', 'JAM'], ['jo', 'JOR'], ['jp', 'JPN'], ['kz', 'KAZ'], ['ke', 'KEN'], ['kg', 'KGZ'], ['kh', 'KHM'], ['kr', 'KOR'], ['xk', 'KOS'], ['kw', 'KWT'], ['la', 'LAO'], ['lb', 'LBN'], ['lr', 'LBR'], ['ly', 'LBY'], ['lk', 'LKA'], ['ls', 'LSO'], ['lt', 'LTU'], ['lu', 'LUX'], ['lv', 'LVA'], ['ma', 'MAR'], ['mc', 'MCO'], ['md', 'MDA'], ['mg', 'MDG'], ['mx', 'MEX'], ['mk', 'MKD'], ['ml', 'MLI'], ['mm', 'MMR'], ['me', 'MNE'], ['mn', 'MNG'], ['mz', 'MOZ'], ['mr', 'MRT'], ['mw', 'MWI'], ['my', 'MYS'], ['na', 'NAM'], ['nc', 'NCL'], ['ne', 'NER'], ['ng', 'NGA'], ['ni', 'NIC'], ['nl', 'NLD'], ['no', 'NOR'], ['np', 'NPL'], ['nz', 'NZL'], ['om', 'OMN'], ['pk', 'PAK'], ['pa', 'PAN'], ['pe', 'PER'], ['ph', 'PHL'], ['pg', 'PNG'], ['pl', 'POL'], ['pr', 'PRI'], ['kp', 'PRK'], ['pt', 'PRT'], ['py', 'PRY'], ['ps', 'PSX'], ['qa', 'QAT'], ['ro', 'ROU'], ['ru', 'RUS'], ['rw', 'RWA'], ['eh', 'SAH'], ['sa', 'SAU'], ['sd', 'SDN'], ['ss', 'SDS'], ['sn', 'SEN'], ['sb', 'SLB'], ['sl', 'SLE'], ['sv', 'SLV'], ['so', 'SOM'], ['rs', 'SRB'], ['sr', 'SUR'], ['sk', 'SVK'], ['si', 'SVN'], ['se', 'SWE'], ['sz', 'SWZ'], ['sy', 'SYR'], ['td', 'TCD'], ['tg', 'TGO'], ['th', 'THA'], ['tj', 'TJK'], ['tm', 'TKM'], ['tl', 'TLS'], ['tt', 'TTO'], ['tn', 'TUN'], ['tr', 'TUR'], ['tw', 'TWN'], ['tz', 'TZA'], ['ug', 'UGA'], ['ua', 'UKR'], ['uy', 'URY'], ['us', 'USA'], ['uz', 'UZB'], ['ve', 'VEN'], ['vn', 'VNM'], ['vu', 'VUT'], ['ye', 'YEM'], ['za', 'ZAF'], ['zm', 'ZMB'], ['zw', 'ZWE'], ['va', 'VAT'], ['sm', 'SMR'], ['li', 'LIE'], ['ad', 'AND'], ['mt', 'MLT'], ['nr', 'NRU'], ['tv', 'TUV'], ['pw', 'PLW'], ['mh', 'MHL'], ['fm', 'FSM'], ['ws', 'WSM'], ['to', 'TON'], ['ki', 'KIR'], ['kn', 'KNA'], ['gd', 'GRD'], ['vc', 'VCT'], ['bb', 'BRB'], ['ag', 'ATG'], ['lc', 'LCA'], ['mv', 'MDV'], ['sc', 'SYC'], ['sg', 'SGP'], ['bh', 'BHR']];
      const nameOverrides = {
        ru: { xk: 'Косово', eh: 'Западная Сахара', fk: 'Фолклендские острова', nc: 'Новая Каледония', gl: 'Гренландия', pr: 'Пуэрто-Рико' },
        en: { xk: 'Kosovo', eh: 'Western Sahara', fk: 'Falkland Islands', nc: 'New Caledonia', gl: 'Greenland', pr: 'Puerto Rico' },
        pt: { xk: 'Kosovo', eh: 'Saara Ocidental', fk: 'Ilhas Malvinas', nc: 'Nova Caledónia', gl: 'Gronelândia', pr: 'Porto Rico' },
        es: { xk: 'Kosovo', eh: 'Sáhara Occidental', fk: 'Islas Malvinas', nc: 'Nueva Caledonia', gl: 'Groenlandia', pr: 'Puerto Rico' },
        de: { xk: 'Kosovo', eh: 'Westsahara', fk: 'Falklandinseln', nc: 'Neukaledonien', gl: 'Grönland', pr: 'Puerto Rico' },
        pl: { xk: 'Kosowo', eh: 'Sahara Zachodnia', fk: 'Falklandy', nc: 'Nowa Kaledonia', gl: 'Grenlandia', pr: 'Portoryko' },
      };
      const alpha2 = new Map(pairs.map(([a2, a3]) => [a3, a2]));
      const game = new Set(pairs.map(([, a3]) => a3));
      let regionNames = new Intl.DisplayNames([lang], { type: 'region' });
      let collator = new Intl.Collator(lang);
      const nameOf = id => nameOverrides[lang]?.[alpha2.get(id)] || regionNames.of(alpha2.get(id).toUpperCase());
      const byName = ids => [...ids].sort((a, b) => collator.compare(nameOf(a), nameOf(b)));
      const listOf = ids => byName(ids).map(nameOf).join(', ');

      // Поправки к соседям из контуров. Сомалиленд и Северный Кипр в данных
      // отдельные, а в игре это части Сомали и Кипра; Гонконг и Макао — части
      // Китая. Ледник Сиачен не страна: его в игре нет, и он отпадает сам.
      // Трёх настоящих заморских границ в контурах нет, их добавляем руками.
      const partOf = { SOL: 'SOM', CYN: 'CYP', HKG: 'CHN', MAC: 'CHN' };
      const extraBorders = [['FRA', 'NLD'], ['ESP', 'MAR'], ['ESP', 'GBR']];

      const palette = {
        trail: { fill: '#f9dfa6', stroke: '#d9a441' },
        neighbour: { fill: '#9ed8c9', stroke: '#2f7f8a' },
        goal: { fill: '#b7d85a', stroke: '#5b7d17' },
        primary: { fill: '#f4b333', stroke: '#ca501b' },
      };
      const paintOrder = ['trail', 'neighbour', 'goal', 'primary'];

      const canvas = $('#globe');
      const ctx = canvas.getContext('2d');
      const projection = d3.geoOrthographic().clipAngle(90).precision(0.3);
      const path = d3.geoPath(projection, ctx);
      const sphere = { type: 'Sphere' };
      const graticule = d3.geoGraticule10();
      let W = 0;
      let H = 0;

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      const pick = items => items[Math.floor(Math.random() * items.length)];

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width;
        H = rect.height;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      document.documentElement.lang = lang;
      $('#legend').textContent = t('loading');

      const world50 = await fetch('countries-50m.json').then(response => response.json());
      const obj50 = world50.objects.features;
      const obj110 = world110.objects.features;
      const byId = new Map(topojson.feature(world50, obj50).features.map(feature => [feature.properties.id, feature]));
      const owner = geometry => partOf[geometry.properties.id] || geometry.properties.id;
      const inner = (a, b) => a !== b && owner(a) !== owner(b);
      const detail = { land: topojson.merge(world50, obj50.geometries), borders: topojson.mesh(world50, obj50, inner) };
      const coarse = { land: topojson.merge(world110, obj110.geometries), borders: topojson.mesh(world110, obj110, inner) };

      const partsById = new Map([...game].map(id => [id, [id]]));
      for (const [part, whole] of Object.entries(partOf)) {
        if (byId.has(part)) partsById.get(whole).push(part);
      }

      const adj = new Map([...game].map(id => [id, new Set()]));
      topojson.neighbors(obj50.geometries).forEach((list, i) => {
        const a = owner(obj50.geometries[i]);
        for (const j of list) {
          const b = owner(obj50.geometries[j]);
          if (a !== b && adj.has(a) && adj.has(b)) {
            adj.get(a).add(b);
            adj.get(b).add(a);
          }
        }
      });
      for (const [a, b] of extraBorders) {
        adj.get(a).add(b);
        adj.get(b).add(a);
      }

      // У Франции есть Гвиана, у США — Аляска и Гавайи: целиться во всю страну
      // значило бы показывать пол-океана. Берём самый большой кусок и то, что
      // лежит не дальше 25° от него.
      function focusOf(id) {
        const polygons = [];
        for (const part of partsById.get(id)) {
          const geometry = byId.get(part).geometry;
          if (geometry.type === 'Polygon') polygons.push({ type: 'Polygon', coordinates: geometry.coordinates });
          else if (geometry.type === 'MultiPolygon') polygons.push(...geometry.coordinates.map(coordinates => ({ type: 'Polygon', coordinates })));
        }
        const main = polygons.reduce((best, polygon) => (d3.geoArea(polygon) > d3.geoArea(best) ? polygon : best));
        const center = d3.geoCentroid(main);
        const near = polygons.filter(polygon => d3.geoDistance(d3.geoCentroid(polygon), center) < 25 * deg);
        return { type: 'MultiPolygon', coordinates: near.map(polygon => polygon.coordinates) };
      }

      const focus = new Map([...game].map(id => [id, focusOf(id)]));
      const centroids = new Map([...game].map(id => [id, d3.geoCentroid(focus.get(id))]));
      const away = (a, b) => d3.geoDistance(centroids.get(a), centroids.get(b)) / deg;

      const hopsCache = new Map();
      function hops(from) {
        if (!hopsCache.has(from)) {
          const distance = new Map([[from, 0]]);
          const queue = [from];
          for (let i = 0; i < queue.length; i++) {
            for (const next of adj.get(queue[i])) {
              if (!distance.has(next)) {
                distance.set(next, distance.get(queue[i]) + 1);
                queue.push(next);
              }
            }
          }
          hopsCache.set(from, distance);
        }
        return hopsCache.get(from);
      }

      const withNeighbours = [...game].filter(id => adj.get(id).size > 0);
      const islands = [...game].filter(id => adj.get(id).size === 0 && id !== 'ATA');

      function wholeGlobeScale() {
        return (Math.min(W, H) / 2) * 0.92;
      }

      // Показываемое занимает до половины окна, но ближе, чем 18° по короткой
      // стороне, не подлетаем: без соседей непонятно, где это вообще. Совсем
      // крошечному (оно и так будет в кольце) даём 30°: у Тувалу при 18° вокруг
      // один океан. Чуть обрезанный по краям глобус выглядит ошибкой, поэтому
      // приближение меньше чем в 1,3 раза не делаем.
      function viewFor(ids, center) {
        const shape = { type: 'GeometryCollection', geometries: ids.map(id => focus.get(id)) };
        const middle = center || (ids.length === 1 ? centroids.get(ids[0]) : d3.geoCentroid(shape));
        const probe = d3.geoOrthographic().rotate([-middle[0], -middle[1]]).scale(1).translate([0, 0]).clipAngle(90);
        const [[x0, y0], [x1, y1]] = d3.geoPath(probe).bounds(shape);
        const fit = Math.min((W * 0.5) / Math.max(x1 - x0, 1e-6), (H * 0.5) / Math.max(y1 - y0, 1e-6));
        const near = Math.min(W, H) / (18 * deg);
        const closest = Math.max(x1 - x0, y1 - y0) * near < 16 ? Math.min(W, H) / (30 * deg) : near;
        const whole = wholeGlobeScale();
        const scale = Math.min(fit, closest);
        return { center: middle, scale: scale < whole * 1.3 ? whole : scale };
      }

      let marks = {};

      function outline(id) {
        for (const part of partsById.get(id)) path(byId.get(part));
      }

      function draw(view, detailed) {
        projection.rotate([-view.center[0], -view.center[1]]).scale(view.scale).translate([W / 2, H / 2]);
        const layers = detailed ? detail : coarse;
        ctx.clearRect(0, 0, W, H);
        ctx.beginPath();
        path(sphere);
        ctx.fillStyle = '#c7e4eb';
        ctx.fill();
        ctx.beginPath();
        path(graticule);
        ctx.strokeStyle = 'rgba(20, 52, 64, .08)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.beginPath();
        path(layers.land);
        ctx.fillStyle = '#f6faf6';
        ctx.fill();
        ctx.beginPath();
        path(layers.borders);
        ctx.strokeStyle = '#9db4bb';
        ctx.lineWidth = 0.7;
        ctx.stroke();
        for (const kind of paintOrder) {
          for (const id of marks[kind] || []) {
            ctx.beginPath();
            outline(id);
            ctx.fillStyle = palette[kind].fill;
            ctx.fill();
            ctx.strokeStyle = palette[kind].stroke;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
        ctx.beginPath();
        path(sphere);
        ctx.strokeStyle = 'rgba(20, 52, 64, .35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        if (!detailed) return;
        // Кольцо, как на картах в Википедии, — если страна меньше пятна 16×16px.
        // Пройденному пути колец не нужно: на Балканах они сливались в кучу.
        for (const kind of paintOrder.filter(kind => kind !== 'trail')) {
          for (const id of marks[kind] || []) {
            const area = partsById.get(id).reduce((sum, part) => sum + path.area(byId.get(part)), 0);
            if (area >= 250 || d3.geoDistance(centroids.get(id), view.center) > 85 * deg) continue;
            const [cx, cy] = projection(centroids.get(id));
            const [[x0, y0], [x1, y1]] = path.bounds(focus.get(id));
            const radius = Math.min(60, Math.max(16, Math.hypot(x1 - x0, y1 - y0) / 2 + 8));
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.strokeStyle = palette[kind].stroke;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }
        }
      }

      let view = null;
      let flight = null;
      let flightTarget = null;

      function flyTo(to) {
        flight?.stop();
        flight = null;
        if (!view || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          view = to;
          draw(view, true);
          return;
        }
        const from = view;
        const distance = d3.geoDistance(from.center, to.center);
        const route = d3.geoInterpolate(from.center, to.center);
        const whole = wholeGlobeScale();
        // На далёкий перелёт отдаляемся до целого глобуса, на соседний — чуть-чуть.
        const lift = Math.min(1, distance / (60 * deg));
        const dip = Math.max(0, Math.log(Math.max(from.scale, to.scale)) - Math.log(whole));
        // От 1,4 с к соседней стране до 3,6 с на другую сторону Земли.
        const duration = 1400 + 2200 * Math.min(1, distance / Math.PI);
        flightTarget = to;
        const timer = d3.timer(elapsed => {
          const progress = Math.min(1, elapsed / duration);
          const e = d3.easeCubicInOut(progress);
          const logScale = Math.log(from.scale) + (Math.log(to.scale) - Math.log(from.scale)) * e - lift * dip * Math.sin(Math.PI * e);
          view = progress < 1 ? { center: route(e), scale: Math.max(whole, Math.exp(logScale)) } : to;
          draw(view, progress === 1);
          if (progress === 1) {
            timer.stop();
            if (flight === timer) flight = null;
          }
        });
        flight = timer;
      }

      const sameView = (a, b) => Boolean(a && b) && Math.abs(a.scale - b.scale) < 0.5 && d3.geoDistance(a.center, b.center) < 1e-6;

      // Перерисовка (ответ, смена языка) не должна заново запускать полёт туда,
      // куда глобус уже летит или где уже стоит: тогда только перекрашиваем.
      function show(nextMarks, ids, center) {
        marks = nextMarks;
        $('#legend').innerHTML = paintOrder
          .filter(kind => (marks[kind] || []).length)
          .map(kind => `<span style="--swatch: ${palette[kind].fill}; --edge: ${palette[kind].stroke}">${escapeHtml(t(`legend_${kind}`))}</span>`)
          .join('');
        const target = viewFor(ids, center);
        if (flight && sameView(flightTarget, target)) return;
        if (!flight && sameView(view, target)) {
          draw(view, true);
          return;
        }
        flyTo(target);
      }

      // Неправильные варианты по сложности: на простом — страны за полсвета,
      // на среднем — с того же края света, на сложном — через одну границу
      // (для Германии это Венгрия, а соседка — Австрия).
      let level = 'medium';

      function distractors(x, count, { exclude = new Set(), neighboursToo = false } = {}) {
        const pool = [...game].filter(id => id !== x && !exclude.has(id));
        const tiers = {
          easy: pool.filter(id => away(id, x) > 50),
          medium: pool.filter(id => away(id, x) > 12 && away(id, x) < 45),
          hard: pool.filter(id => hops(x).get(id) === 2 || (neighboursToo && adj.get(x).has(id))),
        };
        const picked = shuffle(tiers[level]).slice(0, count);
        if (picked.length < count) {
          const rest = pool.filter(id => !picked.includes(id)).sort((a, b) => away(a, x) - away(b, x));
          picked.push(...rest.slice(0, count - picked.length));
        }
        return picked;
      }

      function setTitle(value) {
        $('#title').textContent = value;
      }

      function setMessage(value) {
        $('#message').textContent = value;
      }

      function setChoices(ids, stateOf, onPick) {
        $('#choices').innerHTML = ids.map(id => {
          const state = stateOf(id);
          const classes = [state.correct && 'correct', state.picked && 'picked', state.missed && 'missed', state.wrongPick && 'wrong-pick'].filter(Boolean).join(' ');
          const mark = state.correct ? ' ✓' : state.wrongPick ? ' ✗' : '';
          return `<button data-id="${id}" class="${classes}"${state.disabled ? ' disabled' : ''}>${escapeHtml(nameOf(id))}${mark}</button>`;
        }).join('');
        document.querySelectorAll('#choices button').forEach(button => {
          button.onclick = () => onPick(button.dataset.id);
        });
      }

      function neighboursText(x) {
        const neighbours = [...adj.get(x)];
        const notes = neighbours.map(id => text[lang][`note_${[x, id].sort().join('|')}`]).filter(Boolean);
        return [t('allNeighbours', { count: neighbours.length, list: listOf(neighbours) }), ...notes].join(' ');
      }

      function reveal(x) {
        show({ primary: [x], neighbour: [...adj.get(x)] }, [x, ...[...adj.get(x)].filter(id => away(id, x) < 35)], centroids.get(x));
      }

      function stepOptions(here, goal) {
        if (here === goal) return [];
        const toGoal = hops(goal);
        const neighbours = [...adj.get(here)];
        if (neighbours.length <= 4) return shuffle(neighbours);
        // До четырёх соседей, и хотя бы один из них ближе к цели.
        const helper = pick(neighbours.filter(id => toGoal.get(id) < toGoal.get(here)));
        return shuffle([helper, ...shuffle(neighbours.filter(id => id !== helper)).slice(0, 3)]);
      }

      // Каждый вопрос — состояние и перерисовка по нему, как в игре: смена
      // языка перерисовывает тот же вопрос, а не сбрасывает путешествие.
      const questions = {
        which: {
          create() {
            const x = pick([...game]);
            return { x, options: shuffle([x, ...distractors(x, 3, { neighboursToo: true })]), wrong: [], solved: false };
          },
          render(s) {
            setTitle(t('whichTitle'));
            setChoices(s.options, id => ({ correct: s.solved && id === s.x, disabled: s.solved || s.wrong.includes(id) }), id => {
              if (id === s.x) s.solved = true; else s.wrong.push(id);
              render();
            });
            setMessage(s.solved ? t('solvedIs', { name: nameOf(s.x) }) : s.wrong.length ? t('tryAgain') : '');
            show({ primary: [s.x] }, [s.x]);
          },
        },
        border: {
          create() {
            const x = pick(withNeighbours);
            const answer = pick([...adj.get(x)]);
            return { x, options: shuffle([answer, ...distractors(x, 3, { exclude: adj.get(x) })]), wrong: [], solved: null };
          },
          render(s) {
            setTitle(t('borderTitle', { name: nameOf(s.x) }));
            setChoices(s.options, id => ({ correct: s.solved === id, disabled: Boolean(s.solved) || s.wrong.includes(id) }), id => {
              if (adj.get(s.x).has(id)) s.solved = id; else s.wrong.push(id);
              render();
            });
            if (s.solved) {
              setMessage(`${t('isNeighbour', { name: nameOf(s.solved) })} ${neighboursText(s.x)}`);
              reveal(s.x);
            } else {
              const last = s.wrong[s.wrong.length - 1];
              setMessage(last ? t('notNeighbour', { name: nameOf(last) }) : '');
              show({ primary: [s.x] }, [s.x]);
            }
          },
        },
        all: {
          create() {
            const x = pick(withNeighbours.filter(id => adj.get(id).size >= 2 && adj.get(id).size <= 6));
            const neighbours = adj.get(x);
            return { x, options: shuffle([...neighbours, ...distractors(x, Math.max(2, 8 - neighbours.size), { exclude: neighbours })]), picked: new Set(), checked: false };
          },
          render(s) {
            const neighbours = adj.get(s.x);
            setTitle(t('allTitle', { name: nameOf(s.x) }));
            setChoices(s.options, id => (s.checked
              ? { disabled: true, correct: neighbours.has(id) && s.picked.has(id), missed: neighbours.has(id) && !s.picked.has(id), wrongPick: !neighbours.has(id) && s.picked.has(id) }
              : { picked: s.picked.has(id) }), id => {
              if (s.checked) return;
              if (s.picked.has(id)) s.picked.delete(id); else s.picked.add(id);
              render();
            });
            const check = $('#check');
            check.hidden = false;
            check.disabled = s.checked;
            check.onclick = () => {
              s.checked = true;
              render();
            };
            if (!s.checked) {
              setMessage(t('allHint'));
              show({ primary: [s.x] }, [s.x]);
              return;
            }
            const found = [...neighbours].filter(id => s.picked.has(id)).length;
            const wrong = [...s.picked].filter(id => !neighbours.has(id));
            const lead = found === neighbours.size && !wrong.length
              ? t('allFound')
              : [t('allPartial', { found, total: neighbours.size }), wrong.length ? t('allWrong', { list: listOf(wrong) }) : ''].filter(Boolean).join(' ');
            setMessage(`${lead} ${neighboursText(s.x)}`);
            reveal(s.x);
          },
        },
        odd: {
          create() {
            const x = pick(withNeighbours.filter(id => adj.get(id).size >= 3));
            const [intruder] = distractors(x, 1, { exclude: adj.get(x) });
            return { x, intruder, options: shuffle([...shuffle([...adj.get(x)]).slice(0, 3), intruder]), wrong: [], solved: false };
          },
          render(s) {
            setTitle(t('oddTitle', { name: nameOf(s.x) }));
            setChoices(s.options, id => ({ correct: s.solved && id === s.intruder, disabled: s.solved || s.wrong.includes(id) }), id => {
              if (id === s.intruder) s.solved = true; else s.wrong.push(id);
              render();
            });
            if (s.solved) {
              setMessage(`${t('oddRight', { name: nameOf(s.intruder) })} ${neighboursText(s.x)}`);
              reveal(s.x);
            } else {
              const last = s.wrong[s.wrong.length - 1];
              setMessage(last ? t('oddWrong', { name: nameOf(last) }) : '');
              show({ primary: [s.x] }, [s.x]);
            }
          },
        },
        island: {
          create() {
            const island = pick(islands);
            const others = withNeighbours.filter(id => id !== island).sort((a, b) => away(a, island) - away(b, island)).slice(0, 3);
            return { island, others, options: shuffle([island, ...others]), wrong: [], solved: false };
          },
          render(s) {
            setTitle(t('islandTitle'));
            setChoices(s.options, id => ({ correct: s.solved && id === s.island, disabled: s.solved || s.wrong.includes(id) }), id => {
              if (id === s.island) s.solved = true; else s.wrong.push(id);
              render();
            });
            const last = s.wrong[s.wrong.length - 1];
            setMessage(s.solved
              ? t('islandRight', { name: nameOf(s.island) })
              : last ? t('islandWrong', { name: nameOf(last), list: byName(adj.get(last)).slice(0, 3).map(nameOf).join(', ') }) : '');
            show(s.solved ? { primary: [s.island], neighbour: s.others } : {}, [s.island, ...s.others]);
          },
        },
        journey: {
          create() {
            const [min, max] = { easy: [2, 3], medium: [3, 5], hard: [5, 8] }[level];
            for (let attempt = 0; attempt < 300; attempt++) {
              const start = pick(withNeighbours);
              const goals = [...hops(start)].filter(([, distance]) => distance >= min && distance <= max).map(([id]) => id);
              if (goals.length) {
                const goal = pick(goals);
                return { goal, best: hops(start).get(goal), path: [start], options: stepOptions(start, goal) };
              }
            }
            return null;
          },
          render(s) {
            const here = s.path[s.path.length - 1];
            $('#tag').textContent = t('tripTag', { count: s.path.length - 1 });
            if (here === s.goal) {
              const count = s.path.length - 1;
              setTitle(t('tripDone', { name: nameOf(s.goal) }));
              setChoices([], () => ({}), () => {});
              setMessage(`${t('tripPath', { path: s.path.map(nameOf).join(' → '), count })} ${count === s.best ? t('tripShortest') : t('tripBest', { best: s.best })}`);
              show({ trail: s.path.slice(0, -1), goal: [s.goal] }, [s.path[0], s.goal]);
              return;
            }
            setTitle(t('tripTitle', { from: nameOf(here), to: nameOf(s.goal) }));
            setMessage(t('tripLeft', { count: hops(s.goal).get(here) }));
            setChoices(s.options, () => ({}), id => {
              s.path.push(id);
              s.options = stepOptions(id, s.goal);
              render();
            });
            show({ trail: s.path.slice(0, -1), primary: [here], goal: [s.goal] }, [here, s.goal], d3.geoInterpolate(centroids.get(here), centroids.get(s.goal))(0.5));
          },
        },
      };

      let mode = 'which';
      let count = 0;
      let state = null;

      function renderSwitches() {
        $('#modes').innerHTML = Object.keys(questions)
          .map(key => `<button data-mode="${key}" class="${key === mode ? 'active' : ''}">${escapeHtml(t(`mode_${key}`))}</button>`)
          .join('');
        $('#levels').innerHTML = ['easy', 'medium', 'hard']
          .map(key => `<button data-level="${key}" class="${key === level ? 'active' : ''}">${escapeHtml(t(`level_${key}`))}</button>`)
          .join('');
        document.querySelectorAll('[data-mode]').forEach(button => {
          button.onclick = () => {
            mode = button.dataset.mode;
            newQuestion();
          };
        });
        document.querySelectorAll('[data-level]').forEach(button => {
          button.onclick = () => {
            level = button.dataset.level;
            newQuestion();
          };
        });
      }

      function render() {
        document.documentElement.lang = lang;
        document.title = t('pageTitle');
        $('#note').textContent = t('note');
        $('#langLabel').textContent = t('language');
        $('#lang').value = lang;
        canvas.setAttribute('aria-label', t('globe'));
        $('#modes').setAttribute('aria-label', t('modesLabel'));
        $('#levels').setAttribute('aria-label', t('levelsLabel'));
        renderSwitches();
        $('#check').textContent = t('check');
        $('#check').hidden = mode !== 'all';
        $('#next').textContent = t('next');
        $('#tag').textContent = t('tagQuestion', { n: count });
        questions[mode].render(state);
      }

      function newQuestion() {
        count++;
        state = questions[mode].create();
        render();
      }

      $('#lang').onchange = event => {
        lang = event.target.value;
        try {
          localStorage.setItem('geoDetectiveLang', lang);
        } catch {}
        regionNames = new Intl.DisplayNames([lang], { type: 'region' });
        collator = new Intl.Collator(lang);
        render();
      };

      resize();
      $('#next').disabled = false;
      $('#next').onclick = newQuestion;
      addEventListener('resize', () => {
        resize();
        if (view) {
          flight?.stop();
          flight = null;
          draw(view, true);
        }
      });
      newQuestion();
    </script>
  </body>
</html>
