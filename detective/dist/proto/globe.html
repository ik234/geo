<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#102d38">
    <title>Прототип: страны на глобусе</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../style.css">
    <style>
      .proto-note {
        font-size: 14px;
        color: #b8d3d9;
      }

      .proto-controls {
        margin-bottom: 16px;
      }

      /* Карте нужна колонка пошире, чем флагу. */
      .globe-game {
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      }

      .globe-visual {
        position: relative;
        min-height: 0;
        padding: 16px;
        gap: 10px;
      }

      /* Номер вопроса на широком экране написан над заголовком, а на телефоне
         эта строка скрыта общими стилями игры: там он лежит на глобусе. */
      .round-badge {
        display: none;
      }

      #globe {
        display: block;
        width: 100%;
        height: 420px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 14px;
      }

      .legend span::before {
        content: '';
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 5px;
        border-radius: 3px;
        vertical-align: -1px;
        background: var(--swatch);
        border: 1px solid var(--edge);
      }

      .choices button.picked {
        background: #e3eef1;
        border-color: #143440;
        box-shadow: inset 0 0 0 1px #143440;
      }

      .choices button.wrong-pick {
        background: #fbe3d6;
        border-color: #ca501b;
      }

      .choices button.missed {
        border-style: dashed;
        border-color: #138064;
      }

      .choices button.wrong-pick:disabled,
      .choices button.missed:disabled {
        opacity: 1;
      }

      /* «Все соседи»: до восьми вариантов. В сетке по два в ряд это четыре
         ряда по 52px, и на телефоне последние уходили под панель кнопок на
         130px. Плашками по ширине названия («Чад», «Нигер») выходит три ряда. */
      .choices.chips {
        display: flex;
        flex-wrap: wrap;
      }

      .choices.chips button {
        flex: 1 1 auto;
        min-height: 48px;
      }

      @media (max-width: 700px) {
        /* На телефоне шапка должна остаться в одну строку. */
        .proto-note {
          display: none;
        }

        .globe-game {
          grid-template-columns: minmax(0, 1fr);
        }

        .proto-controls {
          margin-bottom: 10px;
        }

        /* Шесть видов вопросов должны вставать в две строки на всех языках. С
           полями игры по-немецки и по-португальски выходило три, а строка
           здесь стоит 34px высоты над ответами. */
        .proto-controls .modes button {
          padding-left: 6px;
          padding-right: 6px;
        }

        .globe-visual {
          padding: 6px;
        }

        #globe {
          height: 170px;
        }

        .round-badge:not(:empty),
        .globe-visual .legend.several {
          position: absolute;
          border-radius: 8px;
          background: rgba(255, 255, 255, .85);
          color: #143440;
          pointer-events: none;
        }

        .round-badge:not(:empty) {
          display: block;
          top: 10px;
          left: 10px;
          padding: 1px 7px;
          font-size: 13px;
        }

        /* Подписи под картинкой на телефоне общие стили прячут. Легенда с одним
           цветом («страна») и не нужна, а с несколькими ложится на низ глобуса. */
        .globe-visual .legend.several {
          display: flex;
          left: 10px;
          right: 10px;
          bottom: 10px;
          gap: 0 8px;
          padding: 1px 6px;
          font-size: 11px;
        }

        .globe-visual .legend span::before {
          width: 9px;
          height: 9px;
          margin-right: 3px;
        }

        .question {
          padding-top: 10px;
        }

        /* В «Всех соседях» в панели три кнопки. С полями игры, 20px по бокам,
           «Проверить» переносилась во второй ряд и панель вырастала вдвое, а при
           равной ширине кнопок «Antwort zeigen» ломалась на две строки. Ширина
           по надписи, лишнее место делится поровну. */
        .question .actions {
          flex-wrap: nowrap;
        }

        .question .actions button {
          flex: 1 1 auto;
          padding: 8px 6px;
          white-space: nowrap;
        }

        .choices.chips {
          gap: 5px;
        }

        .choices.chips button {
          min-height: 36px;
          padding: 4px 9px;
          font-size: 15px;
        }
      }
    </style>
  </head>

          <option value="pt">Português</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="pl">Polski</option>
        </select>
      </label>
    </header>
    <main>
      <div class="controls proto-controls">
        <div class="modes" id="modes"></div>
        <div class="modes" id="levels"></div>
      </div>
      <section class="game globe-game">
        <div class="visual globe-visual">
          <canvas id="globe" role="img"></canvas>
          <span class="round-badge" id="badge"></span>
          <small class="legend" id="legend"></small>
        </div>
        <div class="question">
          <span class="tag" id="tag"></span>
          <h2 id="title"></h2>
          <div class="choices" id="choices"></div>
          <p class="message" id="message" role="status"></p>
          <div class="actions">
            <button id="hint" hidden></button>
            <button id="reveal" hidden></button>
            <button class="primary" id="check" hidden></button>
            <button class="primary" id="next" hidden></button>
          </div>
        </div>
      </section>
    </main>

      // Пары кодов и ручные названия — из app.js: alpha-2 нужен Intl для

 ['ps', 'PSX'], ['qa', 'QAT'], ['ro', 'ROU'], ['ru', 'RUS'], ['rw', 'RWA'], ['eh', 'SAH'], ['sa', 'SAU'], ['sd', 'SDN'], ['ss', 'SDS'], ['sn', 'SEN'], ['sb', 'SLB'], ['sl', 'SLE'], ['sv', 'SLV'], ['so', 'SOM'], ['rs', 'SRB'], ['sr', 'SUR'], ['sk', 'SVK'], ['si', 'SVN'], ['se', 'SWE'], ['sz', 'SWZ'], ['sy', 'SYR'], ['td', 'TCD'], ['tg', 'TGO'], ['th', 'THA'], ['tj', 'TJK'], ['tm', 'TKM'], ['tl', 'TLS'], ['tt', 'TTO'], ['tn', 'TUN'], ['tr', 'TUR'], ['tw', 'TWN'], ['tz', 'TZA'], ['ug', 'UGA'], ['ua', 'UKR'], ['uy', 'URY'], ['us', 'USA'], ['uz', 'UZB'], ['ve', 'VEN'], ['vn', 'VNM'], ['vu', 'VUT'], ['ye', 'YEM'], ['za', 'ZAF'], ['zm', 'ZMB'], ['zw', 'ZWE'], ['va', 'VAT'], ['sm', 'SMR'], ['li', 'LIE'], ['ad', 'AND'], ['mt', 'MLT'], ['nr', 'NRU'], ['tv', 'TUV'], ['pw', 'PLW'], ['mh', 'MHL'], ['fm', 'FSM'], ['ws', 'WSM'], ['to', 'TON'], ['ki', 'KIR'], ['kn', 'KNA'], ['gd', 'GRD'], ['vc', 'VCT'], ['bb', 'BRB'], ['ag', 'ATG'], ['lc', 'LCA'], ['mv', 'MDV'], ['sc', 'SYC'], ['sg', 'SGP'], ['bh', 'BHR']];
      const nameOverrides = {
        ru: { xk: 'Косово', eh: 'Западная Сахара', fk: 'Фолклендские острова', nc: 'Новая Каледония', gl: 'Гренландия', pr: 'Пуэрто-Рико' },

      const alpha2 = new Map(pairs.map(([a2, a3]) => [a3, a2]));

      // Страны по уровням — те же, что у флагов в игре (easyFlagFacts и

      const levels = ['easy', 'medium', 'hard', 'expert'];
      const levelTier = { easy: 0, medium: 1, hard: 2, expert: 2 };
      const roundSizes = { easy: 5, medium: 15, hard: 30 };
      let level = 'medium';
      // Какие страны называются в вопросах и вариантах на текущем уровне.
      const known = id => tierOf(id) <= levelTier[level];
      let regionNames = new Intl.DisplayNames([intlLocale(lang)], { type: 'region' });
      let collator = new Intl.Collator(intlLocale(lang));
      const nameOf = id => nameOverrides[lang]?.[alpha2.get(id)] || regionNames.of(alpha2.get(id).toUpperCase());
      const byName = ids => [...ids].sort((a, b) => collator.compare(nameOf(a), nameOf(b)));
      const listOf = ids => byName(ids).map(nameOf).join(', ');

      // Поправки к соседям из контуров. Сомалиленд и Северный Кипр в данных
      // отдельные, а в игре это части Сомали и Кипра; Гонконг и Макао — части

      const partOf = { SOL: 'SOM', CYN: 'CYP', HKG: 'CHN', MAC: 'CHN' };
      const extraBorders = [['FRA', 'NLD'], ['ESP', 'MAR'], ['ESP', 'GBR']];

      const canvas = $('#globe');

      let W = 0;

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      const pick = items => items[Math.floor(Math.random() * items.length)];

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

      document.documentElement.lang = lang;

      const world50 = await fetch('countries-50m.json').then(response => response.json());
      const obj50 = world50.objects.features;
      const obj110 = world110.objects.features;
      const byId = new Map(topojson.feature(world50, obj50).features.map(feature => [feature.properties.id, feature]));
      const owner = geometry => partOf[geometry.properties.id] || geometry.properties.id;
      const inner = (a, b) => a !== b && owner(a) !== owner(b);
      const detail = { land: topojson.merge(world50, obj50.geometries), borders: topojson.mesh(world50, obj50, inner) };
      const coarse = { land: topojson.merge(world110, obj110.geometries), borders: topojson.mesh(world110, obj110, inner) };

      const partsById = new Map([...game].map(id => [id, [id]]));
      for (const [part, whole] of Object.entries(partOf)) {
        if (byId.has(part)) partsById.get(whole).push(part);
      }

      const adj = new Map([...game].map(id => [id, new Set()]));
      topojson.neighbors(obj50.geometries).forEach((list, i) => {
        const a = owner(obj50.geometries[i]);
        for (const j of list) {
          const b = owner(obj50.geometries[j]);
          if (a !== b && adj.has(a) && adj.has(b)) {

      // значило бы показывать пол-океана. Берём самый большой кусок и то, что
      // лежит не дальше 25° от него.
      function focusOf(id) {
        const polygons = [];
        for (const part of partsById.get(id)) {
          const geometry = byId.get(part).geometry;
          if (geometry.type === 'Polygon') polygons.push({ type: 'Polygon', coordinates: geometry.coordinates });
          else if (geometry.type === 'MultiPolygon') polygons.push(...geometry.coordinates.map(coordinates => ({ type: 'Polygon', coordinates })));
        }
        const main = polygons.reduce((best, polygon) => (d3.geoArea(polygon) > d3.geoArea(best) ? polygon : best));
        const center = d3.geoCentroid(main);
        const near = polygons.filter(polygon => d3.geoDistance(d3.geoCentroid(polygon), center) < 25 * deg);
        return { type: 'MultiPolygon', coordinates: near.map(polygon => polygon.coordinates) };
      }

      const focus = new Map([...game].map(id => [id, focusOf(id)]));
      const centroids = new Map([...game].map(id => [id, d3.geoCentroid(focus.get(id))]));
      const away = (a, b) => d3.geoDistance(centroids.get(a), centroids.get(b)) / deg;

      // Докуда от точки дотягиваются страны, в градусах. У России это обход
      // шести с половиной тысяч точек, 13 мс, поэтому ответ запоминается.
      const reaches = new Map();
      function reach(point, ids) {
        const key = `${ids}@${point}`;
        if (!reaches.has(key)) {
          let farthest = 0;
          for (const id of ids) {
            for (const polygon of focus.get(id).coordinates) {
              for (const ring of polygon) {
                for (const position of ring) farthest = Math.max(farthest, d3.geoDistance(point, position));
              }
            }
          }
          reaches.set(key, farthest / deg);
        }
        return reaches.get(key);
      }

      const hopsCache = new Map();
      function hops(from) {
        if (!hopsCache.has(from)) {
          const distance = new Map([[from, 0]]);
          const queue = [from];
          for (let i = 0; i < queue.length; i++) {
            for (const next of adj.get(queue[i])) {
              if (!distance.has(next)) {
                distance.set(next, distance.get(queue[i]) + 1);
                queue.push(next);
              }
            }
          }
          hopsCache.set(from, distance);
        }
        return hopsCache.get(from);
      }

      const withNeighbours = [...game].filter(id => adj.get(id).size > 0);
      const islands = [...game].filter(id => adj.get(id).size === 0 && id !== 'ATA');

      function wholeGlobeScale() {
        return (Math.min(W, H) / 2) * 0.92;
      }

      // Показываемое занимает до половины окна, но ближе, чем 18° по короткой
      // стороне, не подлетаем: без соседей непонятно, где это вообще. Совсем
      // крошечному (оно и так будет в кольце) даём 30°: у Тувалу при 18° вокруг
      // один океан. Чуть обрезанный по краям глобус выглядит ошибкой, поэтому
      // приближение меньше чем в 1,3 раза не делаем.
      //
      // Соседей (around) в кадр берём не целиком, а только внутри круга на 4°
      // шире показываемого, радиусом от 6° до 15°. Целиком Россия у Норвегии,
      // Финляндии и Эстонии отбрасывала глобус до целого шара, и сама страна
      // оставалась пятнышком в кольце; так было у 24 стран из 158.
      function viewFor(ids, center, around = []) {
        const shape = { type: 'GeometryCollection', geometries: ids.map(id => focus.get(id)) };
        const middle = center || (ids.length === 1 ? centroids.get(ids[0]) : d3.geoCentroid(shape));
        const probe = d3.geoOrthographic().rotate([-middle[0], -middle[1]]).scale(1).translate([0, 0]).clipAngle(90);
        let [[x0, y0], [x1, y1]] = d3.geoPath(probe).bounds(shape);
        if (around.length) {
          probe.clipAngle(Math.min(15, Math.max(6, reach(middle, ids) + 4)));
          const [[a0, b0], [a1, b1]] = d3.geoPath(probe).bounds({ type: 'GeometryCollection', geometries: around.map(id => focus.get(id)) });
          // Сосед, который весь дальше этого круга, границ не добавляет.
          if (a0 <= a1) [x0, y0, x1, y1] = [Math.min(x0, a0), Math.min(y0, b0), Math.max(x1, a1), Math.max(y1, b1)];
        }
        const fit = Math.min((W * 0.5) / Math.max(x1 - x0, 1e-6), (H * 0.5) / Math.max(y1 - y0, 1e-6));
        const near = Math.min(W, H) / (18 * deg);
        const closest = Math.max(x1 - x0, y1 - y0) * near < 16 ? Math.min(W, H) / (30 * deg) : near;
        const whole = wholeGlobeScale();
        const scale = Math.min(fit, closest);
        return { center: middle, scale: scale < whole * 1.3 ? whole : scale };
      }

      let marks = {};

      function outline(id) {
        for (const part of partsById.get(id)) path(byId.get(part));
      }

      function draw(view, detailed) {
        projection.rotate([-view.center[0], -view.center[1]]).scale(view.scale).translate([W / 2, H / 2]);
        const layers = detailed ? detail : coarse;
        ctx.clearRect(0, 0, W, H);
        ctx.beginPath();
        path(sphere);
        ctx.fillStyle = '#c7e4eb';
        ctx.fill();
        ctx.beginPath();
        path(graticule);
        ctx.strokeStyle = 'rgba(20, 52, 64, .08)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.beginPath();
        path(layers.land);
        ctx.fillStyle = '#f6faf6';
        ctx.fill();
        ctx.beginPath();
        path(layers.borders);
        ctx.strokeStyle = '#9db4bb';
        ctx.lineWidth = 0.7;
        ctx.stroke();
        for (const kind of paintOrder) {
          for (const id of marks[kind] || []) {
            ctx.beginPath();
            outline(id);
            ctx.fillStyle = palette[kind].fill;
            ctx.fill();
            ctx.strokeStyle = palette[kind].stroke;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
        ctx.beginPath();
        path(sphere);
        ctx.strokeStyle = 'rgba(20, 52, 64, .35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        if (!detailed) return;
        // Кольцо, как на картах в Википедии, — если страна меньше пятна 16×16px.
        for (const kind of paintOrder.filter(kind => !ringless.has(kind))) {
          for (const id of marks[kind] || []) {
            const area = partsById.get(id).reduce((sum, part) => sum + path.area(byId.get(part)), 0);
            if (area >= 250 || d3.geoDistance(centroids.get(id), view.center) > 85 * deg) continue;
            const [cx, cy] = projection(centroids.get(id));
            const [[x0, y0], [x1, y1]] = path.bounds(focus.get(id));
            const radius = Math.min(60, Math.max(16, Math.hypot(x1 - x0, y1 - y0) / 2 + 8));
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.strokeStyle = palette[kind].stroke;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }
        }
      }

      let view = null;
      let flight = null;
      let flightTarget = null;

      function flyTo(to) {
        flight?.stop();
        flight = null;
        if (!view || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          view = to;
          draw(view, true);
          return;
        }
        const from = view;
        const distance = d3.geoDistance(from.center, to.center);
        const route = d3.geoInterpolate(from.center, to.center);
        const whole = wholeGlobeScale();
        // На далёкий перелёт отдаляемся до целого глобуса, на соседний — чуть-чуть.
        const lift = Math.min(1, distance / (60 * deg));
        const dip = Math.max(0, Math.log(Math.max(from.scale, to.scale)) - Math.log(whole));
        // От 1,4 с к соседней стране до 3,6 с на другую сторону Земли.
        const duration = 1400 + 2200 * Math.min(1, distance / Math.PI);
        flightTarget = to;
        const timer = d3.timer(elapsed => {
          const progress = Math.min(1, elapsed / duration);
          const e = d3.easeCubicInOut(progress);
          const logScale = Math.log(from.scale) + (Math.log(to.scale) - Math.log(from.scale)) * e - lift * dip * Math.sin(Math.PI * e);
          view = progress < 1 ? { center: route(e), scale: Math.max(whole, Math.exp(logScale)) } : to;
          draw(view, progress === 1);
          if (progress === 1) {
            timer.stop();
            if (flight === timer) flight = null;
          }
        });
        flight = timer;
      }

      const sameView = (a, b) => Boolean(a && b) && Math.abs(a.scale - b.scale) < 0.5 && d3.geoDistance(a.center, b.center) < 1e-6;

      // Перерисовка (ответ, смена языка) не должна заново запускать полёт туда,
      // куда глобус уже летит или где уже стоит: тогда только перекрашиваем, а
      // если и краски те же — не трогаем вовсе. Подробный кадр стоит около 0,1 с,
      // а в «Всех соседях» перерисовка идёт на каждое нажатие варианта.
      function show(nextMarks, ids, center, around) {
        const repaint = JSON.stringify(nextMarks) !== JSON.stringify(marks);
        marks = nextMarks;
        const kinds = paintOrder.filter(kind => (marks[kind] || []).length);
        $('#legend').innerHTML = kinds
          .map(kind => `<span style="--swatch: ${palette[kind].fill}; --edge: ${palette[kind].stroke}">${escapeHtml(t(`legend_${kind}`))}</span>`)
          .join('');
        $('#legend').classList.toggle('several', kinds.length > 1);
        const target = viewFor(ids, center, around);
        if (flight && sameView(flightTarget, target)) return;
        if (!flight && sameView(view, target)) {
          if (repaint) draw(view, true);
          return;
        }
        flyTo(target);
      }

      // Неправильные варианты по сложности: на простом — страны за полсвета,
      // на среднем — с того же края света, на сложном и у эксперта — через одну
      // границу (для Германии это Венгрия, а соседка — Австрия). Варианты берутся
      // из стран своего уровня: на простом среди них не бывает Буркина-Фасо.
      function distractors(x, count, { exclude = new Set(), neighboursToo = false } = {}) {
        const pool = [...game].filter(id => id !== x && !exclude.has(id) && known(id));
        const rules = {
          easy: id => away(id, x) > 50,
          medium: id => away(id, x) > 12 && away(id, x) < 45,
          hard: id => hops(x).get(id) === 2 || (neighboursToo && adj.get(x).has(id)),
        };
        const picked = shuffle(pool.filter(rules[level === 'expert' ? 'hard' : level])).slice(0, count);
        if (picked.length < count) {
          const rest = pool.filter(id => !picked.includes(id)).sort((a, b) => away(a, x) - away(b, x));
          picked.push(...rest.slice(0, count - picked.length));
        }
        return picked;
      }

      const lastOf = items => items[items.length - 1];
      const firstLetter = value => [...String(value).trim()][0]?.toLocaleUpperCase(lang) || '';

      function setTitle(value) {
        $('#title').textContent = value;
      }

      // Подсказка остаётся в сообщении и после ошибки: иначе, спросив первую
      // букву и промахнувшись, ребёнок терял бы её.
      function setMessage(...parts) {
        $('#message').textContent = parts.filter(Boolean).join(' ');
      }

      function setChoices(ids, stateOf, onPick, layout = 'grid') {
        $('#choices').className = layout === 'chips' ? 'choices chips' : 'choices';
        $('#choices').innerHTML = ids.map(id => {
          const state = stateOf(id);
          const classes = [state.correct && 'correct', state.picked && 'picked', state.missed && 'missed', state.wrongPick && 'wrong-pick'].filter(Boolean).join(' ');
          const mark = state.correct ? ' ✓' : state.wrongPick ? ' ✗' : '';
          return `<button data-id="${id}" class="${classes}"${state.disabled ? ' disabled' : ''}>${escapeHtml(nameOf(id))}${mark}</button>`;
        }).join('');
        document.querySelectorAll('#choices button').forEach(button => {
          button.onclick = () => onPick(button.dataset.id);
        });
      }

      function neighboursText(x) {
        const neighbours = [...adj.get(x)];
        const notes = neighbours.map(id => text[lang][`note_${[x, id].sort().join('|')}`]).filter(Boolean);
        return [t('allNeighbours', { count: neighbours.length, list: listOf(neighbours) }), ...notes].join(' ');
      }

      function showNeighbours(x) {
        const neighbours = [...adj.get(x)];
        show({ primary: [x], neighbour: neighbours }, [x], centroids.get(x), neighbours.filter(id => away(id, x) < 35));
      }

      function stepOptions(here, goal) {
        if (here === goal) return [];
        const toGoal = hops(goal);
        const neighbours = [...adj.get(here)];
        if (neighbours.length <= 4) return shuffle(neighbours);
        // До четырёх соседей, и хотя бы один из них ближе к цели.
        const helper = pick(neighbours.filter(id => toGoal.get(id) < toGoal.get(here)));
        return shuffle([helper, ...shuffle(neighbours.filter(id => id !== helper)).slice(0, 3)]);
      }

      const tripLengths = { easy: [2, 3], medium: [3, 5], hard: [5, 8], expert: [5, 8] };

      function goalsFrom(start) {
        const [min, max] = tripLengths[level];
        return [...hops(start)].filter(([id, distance]) => distance >= min && distance <= max && known(id)).map(([id]) => id);
      }

      // Каждый вопрос — состояние и перерисовка по нему, как в игре: смена
      // языка перерисовывает тот же вопрос, а не сбрасывает путешествие.
      // pool — про какие страны спрашивать на текущем уровне, create — вопрос
      // про одну из них, hint и reveal — «Подсказка» и «Узнать ответ», result —
      // что записать в итоги раунда.
      const questions = {
        which: {
          pool: () => [...game].filter(known),
          create(x) {
            return { x, options: shuffle([x, ...distractors(x, 3, { neighboursToo: true })]), wrong: [], solved: false };
          },
          hint: s => t('countryHint', { letter: firstLetter(nameOf(s.x)) }),
          reveal(s) {
            s.solved = true;
          },
          render(s) {
            setTitle(t('whichTitle'));
            setChoices(s.options, id => ({ correct: s.solved && id === s.x, disabled: s.solved || s.wrong.includes(id) }), id => {
              if (id === s.x) s.solved = true; else s.wrong.push(id);
              answered();
            });
            if (s.solved) setMessage(t(s.revealed ? 'answerIs' : 'solvedIs', { name: nameOf(s.x) }));
            else setMessage(s.wrong.length && t('tryAgain'), s.hinted && this.hint(s));
            show({ primary: [s.x] }, [s.x]);
          },
          result: s => ({ correct: !s.revealed, mistakes: s.wrong.length }),
        },
        border: {
          pool: () => [...game].filter(id => known(id) && [...adj.get(id)].some(known)),
          create(x) {
            const answer = pick([...adj.get(x)].filter(known));
            return { x, answer, options: shuffle([answer, ...distractors(x, 3, { exclude: adj.get(x) })]), wrong: [], solved: false };
          },
          hint: s => t('countryHint', { letter: firstLetter(nameOf(s.answer)) }),
          reveal(s) {
            s.solved = true;
          },
          render(s) {
            setTitle(t('borderTitle', { name: nameOf(s.x) }));
            setChoices(s.options, id => ({ correct: s.solved && id === s.answer, disabled: s.solved || s.wrong.includes(id) }), id => {
              if (id === s.answer) s.solved = true; else s.wrong.push(id);
              answered();
            });
            if (s.solved) {
              setMessage(t(s.revealed ? 'answerIs' : 'isNeighbour', { name: nameOf(s.answer) }), neighboursText(s.x));
              showNeighbours(s.x);
            } else {
              setMessage(s.wrong.length && t('notNeighbour', { name: nameOf(lastOf(s.wrong)) }), s.hinted && this.hint(s));
              show({ primary: [s.x] }, [s.x]);
            }
          },
          result: s => ({ correct: !s.revealed, mistakes: s.wrong.length }),
        },
        all: {
          pool: () => [...game].filter(id => known(id) && adj.get(id).size >= 2 && adj.get(id).size <= 6),
          create(x) {
            const neighbours = adj.get(x);
            // Чем проще уровень, тем меньше лишних вариантов, но не меньше двух.
            const size = { easy: 5, medium: 6, hard: 8, expert: 8 }[level];
            return { x, options: shuffle([...neighbours, ...distractors(x, Math.max(2, size - neighbours.size), { exclude: neighbours })]), picked: new Set(), checked: false };
          },
          // Подсказка — сколько соседей, и они закрашены на глобусе без
          // названий: какая форма какому варианту соответствует, решать самому.
          hint: s => t('allCount', { count: adj.get(s.x).size }),
          reveal(s) {
            s.checked = true;
          },
          render(s) {
            const neighbours = adj.get(s.x);
            setTitle(t('allTitle', { name: nameOf(s.x) }));
            setChoices(s.options, id => {
              if (!s.checked) return { picked: s.picked.has(id) };
              const neighbour = neighbours.has(id);
              const picked = s.picked.has(id);
              return { disabled: true, correct: neighbour && (picked || s.revealed), missed: neighbour && !picked && !s.revealed, wrongPick: !neighbour && picked };
            }, id => {
              if (s.checked) return;
              if (s.picked.has(id)) s.picked.delete(id); else s.picked.add(id);
              render();
            }, 'chips');
            if (!s.checked) {
              setMessage(s.hinted ? this.hint(s) : t('allHint'));
              if (s.hinted) showNeighbours(s.x); else show({ primary: [s.x] }, [s.x]);
              return;
            }
            const found = [...neighbours].filter(id => s.picked.has(id)).length;
            const wrong = [...s.picked].filter(id => !neighbours.has(id));
            const lead = s.revealed
              ? ''
              : found === neighbours.size && !wrong.length
                ? t('allFound')
                : [t('allPartial', { found, total: neighbours.size }), wrong.length && t('allWrong', { list: listOf(wrong) })].filter(Boolean).join(' ');
            setMessage(lead, neighboursText(s.x));
            showNeighbours(s.x);
          },
          result(s) {
            const neighbours = adj.get(s.x);
            const missed = [...neighbours].filter(id => !s.picked.has(id)).length;
            const wrong = [...s.picked].filter(id => !neighbours.has(id)).length;
            return { correct: !s.revealed && !missed && !wrong, mistakes: s.revealed ? 0 : missed + wrong };
          },
        },
        odd: {
          pool: () => [...game].filter(id => known(id) && adj.get(id).size >= 3),
          create(x) {
            // Соседи своего уровня идут вперёд, незнакомые — только если своих не хватает.
            const shown = shuffle([...adj.get(x)]).sort((a, b) => Number(!known(a)) - Number(!known(b))).slice(0, 3);
            const [intruder] = distractors(x, 1, { exclude: adj.get(x) });
            return { x, intruder, options: shuffle([...shown, intruder]), wrong: [], solved: false };
          },
          hint: s => t('countryHint', { letter: firstLetter(nameOf(s.intruder)) }),
          reveal(s) {
            s.solved = true;
          },
          render(s) {
            setTitle(t('oddTitle', { name: nameOf(s.x) }));
            setChoices(s.options, id => ({ correct: s.solved && id === s.intruder, disabled: s.solved || s.wrong.includes(id) }), id => {
              if (id === s.intruder) s.solved = true; else s.wrong.push(id);
              answered();
            });
            if (s.solved) {
              setMessage(t(s.revealed ? 'notNeighbour' : 'oddRight', { name: nameOf(s.intruder) }), neighboursText(s.x));
              showNeighbours(s.x);
            } else {
              setMessage(s.wrong.length && t('oddWrong', { name: nameOf(lastOf(s.wrong)) }), s.hinted && this.hint(s));
              show({ primary: [s.x] }, [s.x]);
            }
          },
          result: s => ({ correct: !s.revealed, mistakes: s.wrong.length }),
        },
        island: {
          // Среди 24 простых стран островных всего две, Австралия и Япония,
          // поэтому простому уровню достаются островные страны среднего.
          pool: () => islands.filter(id => tierOf(id) <= Math.max(1, levelTier[level])),
          create(island) {
            const others = withNeighbours.filter(known).sort((a, b) => away(a, island) - away(b, island)).slice(0, 3);
            return { island, others, options: shuffle([island, ...others]), wrong: [], solved: false };
          },
          hint: s => t('countryHint', { letter: firstLetter(nameOf(s.island)) }),
          reveal(s) {
            s.solved = true;
          },
          render(s) {
            setTitle(t('islandTitle'));
            setChoices(s.options, id => ({ correct: s.solved && id === s.island, disabled: s.solved || s.wrong.includes(id) }), id => {
              if (id === s.island) s.solved = true; else s.wrong.push(id);
              answered();
            });
            const last = lastOf(s.wrong);
            if (s.solved) setMessage(t(s.revealed ? 'islandNote' : 'islandRight', { name: nameOf(s.island) }));
            else setMessage(last && t('islandWrong', { name: nameOf(last), list: byName(adj.get(last)).slice(0, 3).map(nameOf).join(', ') }), s.hinted && this.hint(s));
            show(s.solved ? { primary: [s.island], neighbour: s.others } : {}, [s.island, ...s.others]);
          },
          result: s => ({ correct: !s.revealed, mistakes: s.wrong.length }),
        },
        journey: {
          pool: () => [...game].filter(id => known(id) && goalsFrom(id).length),
          create(start) {
            const goal = pick(goalsFrom(start));
            return { goal, best: hops(start).get(goal), path: [start], options: stepOptions(start, goal) };
          },
          // Подсказка на один шаг: какой из вариантов ближе к цели. Такой среди
          // вариантов есть всегда, об этом заботится stepOptions.
          hint(s) {
            const toGoal = hops(s.goal);
            const here = lastOf(s.path);
            return t('tripHint', { name: nameOf(s.options.find(id => toGoal.get(id) < toGoal.get(here))) });
          },
          // Ответ — кратчайший путь отсюда. Первый шаг — из показанных
          // вариантов, дальше из равных по длине путей — через знакомые страны.
          reveal(s) {
            const toGoal = hops(s.goal);
            const route = [lastOf(s.path)];
            while (lastOf(route) !== s.goal) {
              const at = lastOf(route);
              const closer = id => toGoal.get(id) === toGoal.get(at) - 1;
              const steps = route.length === 1 ? s.options.filter(closer) : byName([...adj.get(at)].filter(closer)).sort((a, b) => Number(!known(a)) - Number(!known(b)));
              route.push(steps[0]);
            }
            s.route = route;
          },
          render(s) {
            const here = lastOf(s.path);
            const middle = d3.geoInterpolate(centroids.get(here), centroids.get(s.goal))(0.5);
            const crossed = s.path.length > 1 && t('tripCrossed', { count: s.path.length - 1 });
            if (s.route) {
              setTitle(`${nameOf(here)} → ${nameOf(s.goal)}`);
              setChoices([], () => ({}), () => {});
              setMessage(crossed, t('tripRoute', { path: s.route.map(nameOf).join(' → ') }));
              show({ trail: s.path.slice(0, -1), route: s.route.slice(1, -1), primary: [here], goal: [s.goal] }, [here, s.goal], middle);
              return;
            }
            if (here === s.goal) {
              const count = s.path.length - 1;
              setTitle(t('tripDone', { name: nameOf(s.goal) }));
              setChoices([], () => ({}), () => {});
              setMessage(t('tripPath', { path: s.path.map(nameOf).join(' → '), count }), count === s.best ? t('tripShortest') : t('tripBest', { best: s.best }));
              show({ trail: s.path.slice(0, -1), goal: [s.goal] }, [s.path[0], s.goal]);
              return;
            }
            setTitle(t('tripTitle', { from: nameOf(here), to: nameOf(s.goal) }));
            setMessage(crossed, t('tripLeft', { count: hops(s.goal).get(here) }), s.hintStep === s.path.length && this.hint(s));
            setChoices(s.options, () => ({}), id => {
              s.path.push(id);
              s.options = stepOptions(id, s.goal);
              answered();
            });
            show({ trail: s.path.slice(0, -1), primary: [here], goal: [s.goal] }, [here, s.goal], middle);
          },
          result: s => ({ correct: !s.route, mistakes: s.route ? 0 : s.path.length - 1 - s.best }),
        },
      };

      const isDone = s => Boolean(s.solved || s.checked || s.route || (s.path && lastOf(s.path) === s.goal));
      // Про какую страну был вопрос — её и закрашиваем в итогах раунда.
      const subjectOf = s => s.x || s.island || s.goal;

      let mode = 'which';
      let round = null;
      let state = null;

      function newRound() {
        const deck = shuffle(questions[mode].pool());
        round = { deck: level === 'expert' ? deck : deck.slice(0, roundSizes[level]), index: 0, correct: 0, mistakes: 0, hints: 0, results: new Map() };
        state = round.deck.length ? questions[mode].create(round.deck[0]) : null;
        render();
      }

      function nextQuestion() {
        const { correct, mistakes } = questions[mode].result(state);
        round.correct += Number(correct);
        round.mistakes += mistakes;
        round.hints += Number(Boolean(state.hinted));
        round.results.set(subjectOf(state), correct);
        round.index++;
        state = round.index < round.deck.length ? questions[mode].create(round.deck[round.index]) : null;
        render();
      }

      // Ответ на телефоне может оказаться под закреплённой панелью кнопок. Тогда
      // докручиваем ровно на нехватку, как revealSolvedNote() в игре.
      function answered() {
        render();
        if (!isDone(state)) return;
        const actions = $('.question .actions');
        const floor = getComputedStyle(actions).position === 'fixed' ? actions.getBoundingClientRect().top : innerHeight;
        const hidden = Math.round($('#message').getBoundingClientRect().bottom + 8 - floor);
        if (hidden > 0) scrollBy({ top: hidden, behavior: 'smooth' });
      }

      function renderFinish() {
        $('#tag').textContent = t('finishTag');
        setTitle(t('finishTitle'));
        setChoices([], () => ({}), () => {});
        setMessage(t('scoreBreakdown', { correct: round.correct, total: round.deck.length, mistakes: round.mistakes, hints: round.hints }));
        const asked = [...round.results.keys()];
        if (asked.length) show({ solved: asked.filter(id => round.results.get(id)), unsolved: asked.filter(id => !round.results.get(id)) }, asked);
      }

      function renderActions() {
        const done = !state || isDone(state);
        $('#hint').textContent = t('hint');
        $('#reveal').textContent = t('reveal');
        $('#check').textContent = t('check');
        $('#next').textContent = !state ? t('playAgain') : round.index + 1 < round.deck.length ? t('next') : t('finishRound');
        $('#hint').hidden = done;
        $('#reveal').hidden = done;
        $('#check').hidden = done || mode !== 'all';
        $('#next').hidden = !done;
      }

      function renderSwitches() {
        $('#modes').innerHTML = Object.keys(questions)
          .map(key => `<button data-mode="${key}" class="${key === mode ? 'active' : ''}">${escapeHtml(t(`mode_${key}`))}</button>`)
          .join('');
        $('#levels').innerHTML = levels
          .map(key => `<button data-level="${key}" class="${key === level ? 'active' : ''}">${escapeHtml(t(`level_${key}`))}</button>`)
          .join('');
        document.querySelectorAll('[data-mode]').forEach(button => {
          button.onclick = () => {
            mode = button.dataset.mode;
            newRound();
          };
        });
        document.querySelectorAll('[data-level]').forEach(button => {
          button.onclick = () => {
            level = button.dataset.level;
            newRound();
          };
        });
      }

      function render() {
        document.documentElement.lang = lang;
        document.title = t('pageTitle');
        $('#note').textContent = t('note');
        $('#langLabel').textContent = t('language');
        $('#lang').value = lang;
        canvas.setAttribute('aria-label', t('globe'));
        $('#modes').setAttribute('aria-label', t('modesLabel'));
        $('#levels').setAttribute('aria-label', t('levelsLabel'));
        renderSwitches();
        $('#badge').textContent = state ? `${round.index + 1} / ${round.deck.length}` : '';
        if (state) {
          $('#tag').textContent = t('tagQuestion', { n: round.index + 1, total: round.deck.length });
          questions[mode].render(state);
        } else {
          renderFinish();
        }
        renderActions();
      }

      $('#hint').onclick = () => {
        state.hinted = true;
        if (state.path) state.hintStep = state.path.length;
        render();
      };
      $('#reveal').onclick = () => {
        state.revealed = true;
        questions[mode].reveal(state);
        answered();
      };
      $('#check').onclick = () => {
        state.checked = true;
        answered();
      };
      $('#next').onclick = () => (state ? nextQuestion() : newRound());

      $('#lang').onchange = event => {
        lang = event.target.value;
        try {
          localStorage.setItem('geoDetectiveLang', lang);
        } catch {}
        regionNames = new Intl.DisplayNames([intlLocale(lang)], { type: 'region' });
        collator = new Intl.Collator(intlLocale(lang));
        render();
      };

      resize();
      // Safari на iPhone шлёт resize всякий раз, когда прячет или показывает свою
      // панель при прокрутке, а холст при этом того же размера. Раньше такой
      // resize останавливал перелёт, и глобус замирал на полпути между странами.
      // Идущий перелёт следующим кадром сам нарисует глобус в новом размере.
      addEventListener('resize', () => {
        const rect = canvas.getBoundingClientRect();
        if (rect.width === W && rect.height === H) return;
        resize();
        if (view && !flight) draw(view, true);
      });
      newRound();
    </script>
  </body>
</html>
