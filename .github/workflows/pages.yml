name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages умеет отдавать только корень репозитория или /docs, а сайт лежит в detective/dist/.
# Публикация артефактом снимает это ограничение: каталог остаётся на месте.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Список офлайн-кэша и его версию считаем из фактического содержимого
      # detective/dist/, чтобы выложенный sw.js не мог разойтись с выложенными файлами.
      - run: python3 detective/tools/gen-sw.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: detective/dist
      - id: deployment
        uses: actions/deploy-pages@v4
